name: CI

on:
  # No `branches:` filter here on purpose: stacked PRs (e.g. a fix PR based on another
  # open feature/test branch instead of main) still need CI. `branches:` on `pull_request`
  # matches against the PR's base branch, so restricting it to `main` silently skips CI
  # for every PR whose base isn't main.
  #
  # No `push` trigger to main. zs-land only squash-merges a green PR, so the merge commit
  # already ran this exact suite on the PR's own pull_request run — re-running it on push
  # duplicated the full ~25-minute, 6-job suite on every merge (536 runs in 6 days against
  # this repo's Actions budget, 2026-10-06). The one job that only makes sense post-merge
  # — Migration drift, checked against production — moved to its own push-to-main
  # workflow: .github/workflows/migration-drift.yml.
  #
  # `schedule` + `workflow_dispatch` give main a cheap periodic signal instead: each PR run
  # only proves its own branch is good against the main it forked from, so two PRs that are
  # each green on their own can still break main once both land (this happened after #470).
  # One nightly run (~25 billed min/day) catches that within a day for ~170 fewer
  # runs/week than push-to-main gave us. Trigger one on demand right after landing a
  # cluster of PRs with:
  #   gh workflow run ci.yml --repo wiggdevin/sasha-meal-companion --ref main
  # Longer term, once this repo is public and branch protection supports it, a merge queue
  # (tests the post-merge result before merging, instead of after) replaces this entirely.
  pull_request: {}
  schedule:
    - cron: "17 9 * * *" # ~09:17 UTC daily
  workflow_dispatch: {}

concurrency:
  # github.ref for a pull_request run is refs/pull/<PR>/merge, so this already scopes to
  # one concurrency group per PR — a new push to the PR cancels the stale run. For
  # `schedule` and `workflow_dispatch`, github.ref is refs/heads/main for both, so they
  # share one `ci-refs/heads/main` group: at most one main-branch run is ever in flight,
  # and a manual run started right after the nightly one cancels it, which is fine — the
  # newer run is a superset check of the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every job starts at once (2026-10-04: the chain Quality → Integration took ~27 min). The
  # three required checks — Quality, Integration, Build — keep their names; Quality is a small
  # gate over parallel jobs, so branch protection is unchanged.
  static:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Offline: no token, no network beyond the install. Pinned so a new audit never reddens main unannounced.
      - name: Workflow security lint (zizmor)
        run: pipx run zizmor==1.31.1 --offline --min-severity low .github/workflows

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install catalog worker dependencies
        run: python3 -m pip install -r scripts/requirements.txt pytest

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit
        env:
          # The project's type graph outgrew Node's default heap on the 7 GB hosted runner (OOM, 2026-10-05).
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Test catalog import worker
        run: python3 -m pytest tests/catalog/test_import_fdc.py -q

  unit:
    name: Unit tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every shard reports, so one red run shows all of its failures at once.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test --shard=${{ matrix.shard }}/4

  # A partial rerun is safe: rerunning one failed shard reruns this gate too, and
  # needs.unit.result stays failure until every shard's latest attempt passed (checked live on
  # 2026-10-04, wiggdevin/zs-land-sandbox run 37248882225, attempts 1-3).
  quality:
    name: Quality
    needs: [static, unit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require lint, types and every unit shard
        run: |
          test "${{ needs.static.result }}" = success
          test "${{ needs.unit.result }}" = success

  # Only the ~100 files that use a database (scripts/ci-integration-files.ts); the unit shards
  # run the rest. One runner, one disposable database, files one at a time.
  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate local integration setup
        run: python3 -m unittest discover -s tests/ci -p 'test_*.py'

      # The installed, lockfile-pinned CLI applies migrations to disposable Docker containers.
      # No hosted project credentials are required, and missing setup is a failure.
      - name: Start local Supabase and seed test helpers
        timeout-minutes: 12
        run: python3 scripts/ci-local-supabase.py start

      # The throwaway-Postgres suites (tests/migrations/*, the files that name PG_BIN) need the
      # server binaries. The hosted Ubuntu image ships PostgreSQL under /usr/lib/postgresql/<n>/bin
      # (not on PATH, service off); without PG_BIN they skipped in CI until W040.
      - name: Point the throwaway-Postgres suites at the runner's Postgres
        run: |
          bindir="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1)"
          test -x "$bindir/initdb" && test -x "$bindir/pg_ctl" && test -x "$bindir/psql"
          "$bindir/initdb" --version
          echo "PG_BIN=$bindir" >> "$GITHUB_ENV"

      - name: Run integration suite
        timeout-minutes: 15
        run: pnpm test:integration
        env:
          VITEST_JSON_REPORT: ${{ runner.temp }}/integration-report.json

      # Lists every skipped test, and fails above the ceiling in scripts/ci-skip-ceiling.json or
      # when a throwaway-Postgres test skipped (docs/ci/skipped-tests.md).
      - name: Check skipped tests
        run: pnpm exec tsx scripts/ci-skip-ceiling.ts "${{ runner.temp }}/integration-report.json"

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder

      # W079: the heaviest route's first-load JavaScript and all client chunks stay inside
      # scripts/perf-budget.json (gzipped). Raising it is a deliberate edit in the PR that grows them.
      - name: Bundle budget
        run: pnpm exec tsx scripts/bundle-budget.ts

      # W079: the built sign-in page loads with no CSP violation (report-only ones too) and meets
      # the Lighthouse mobile scores in scripts/perf-budget.json (median of three runs).
      - name: Install Lighthouse
        run: npm ci --no-audit --no-fund --prefix scripts/page-gate

      - name: Page gate (CSP and Lighthouse)
        timeout-minutes: 10
        run: |
          pnpm start --port 3000 > "$RUNNER_TEMP/next-start.log" 2>&1 &
          for _ in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3000/sign-in && break; sleep 1; done
          curl -fsS -o /dev/null http://localhost:3000/sign-in || { cat "$RUNNER_TEMP/next-start.log"; exit 1; }
          node scripts/page-gate/gate.mjs http://localhost:3000
        env:
          CHROME_PATH: /usr/bin/google-chrome
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
