name: Ops check

# OD02 (docs/decisions/2026-10-12-owner-decisions.md): no new vendor. Every 15 minutes this checks
# /api/health, the JSON and hosted backups, unfinished job passes, AI spend against its daily caps
# and the month's search-grounding queries (scripts/ops-check.py), and
# keeps one `ops-alert` issue per problem: opened when it starts, closed when it clears. Issue
# bodies carry no personal data. The database checks are a no-op until the SUPABASE_ACCESS_TOKEN
# and SUPABASE_PROJECT_REF secrets exist (the same pair migration-drift.yml reads).
# Run it by hand with a "test alert" rule to file and close one test issue for that rule.
#
# GitHub turns scheduled workflows off after 60 days without repository activity; re-enable this
# one from the Actions tab if that ever happens.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "File and close one test issue for this rule (blank: a normal check)"
        required: false
        default: ""
        type: choice
        options: ["", "health", "backup-json", "backup-hosted", "job-pass", "ai-spend", "grounding"]

permissions:
  contents: read
  issues: write

# One check at a time, so two overlapping runs can never both open an issue.
concurrency:
  group: ops-check
  cancel-in-progress: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Standard library only: no install step on a job that runs 96 times a day.
      - name: Check health, backups, job passes and AI spend
        run: python3 scripts/ops-check.py ${TEST_ALERT:+--test-alert "$TEST_ALERT"}
        env:
          TEST_ALERT: ${{ inputs.test_alert }}
          HEALTH_URL: ${{ vars.HEALTH_URL }}
          # Unset, the script uses the app's default caps (lib/ai/spend.ts).
          AI_GLOBAL_DAILY_SPEND_CAP_USD: ${{ vars.AI_GLOBAL_DAILY_SPEND_CAP_USD }}
          AI_BACKGROUND_DAILY_SPEND_CAP_USD: ${{ vars.AI_BACKGROUND_DAILY_SPEND_CAP_USD }}
          AI_DAILY_SPEND_CAP_USD: ${{ vars.AI_DAILY_SPEND_CAP_USD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
