name: AI canary

# W146: runs scripts/ai-canary.ts against the real Gemini API, weekly and on demand only (never on
# push or pull_request). It answers whether each pinned model serves a structured call and whether
# the key sits on a billing-enabled project; the script exits 1 when the verdict is UNPAID or a
# structured call fails. With no GEMINI_API_KEY secret the job logs that and passes.

on:
  schedule:
    # 09:30 UTC every Monday.
    - cron: "30 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ai-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Canary
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Skip when no key is set
        if: ${{ env.GEMINI_API_KEY == '' }}
        run: echo "GEMINI_API_KEY is not set as a repo secret; skipping the canary."

      - name: Check out code
        if: ${{ env.GEMINI_API_KEY != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        if: ${{ env.GEMINI_API_KEY != '' }}
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        if: ${{ env.GEMINI_API_KEY != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: pnpm install --frozen-lockfile

      - name: Run the canary
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: pnpm exec tsx scripts/ai-canary.ts
