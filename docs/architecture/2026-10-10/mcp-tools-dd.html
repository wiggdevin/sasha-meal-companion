<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --color-paper: #E0DCD1; --color-ink: #1D1D1C; --color-muted: #4F5343; --color-soft: #5E5C55; --color-accent: #9E431B;
  --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;
  --font-serif: 'Fraunces', Georgia, serif;
  --font-mono: 'Geist Mono', ui-monospace, monospace;
}
body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; padding: 3rem 2rem; }
.frame { max-width: 1200px; margin: 0 auto; }
.diagram-container { width: 100%; overflow-x: auto; }
.eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 1.75rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
.note { font-size: 0.85rem; line-height: 1.5; color: var(--color-soft); margin-top: 1.25rem; max-width: 70ch; }
.note code { font-family: var(--font-mono); font-size: 0.8rem; }
svg { width: 100%; min-width: 1072px; display: block; }
@media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
</style>
