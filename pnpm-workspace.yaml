allowBuilds:
  '@google/genai': true
  protobufjs: true
  esbuild: true
  sharp: false
  unrs-resolver: false

# Dependabot alerts on transitive dev-only deps: each consumer gets the patched
# release on the major it already resolves to.
#   brace-expansion <1.1.21 (via minimatch@3 <- eslint toolchain) and
#   brace-expansion >=4 <5.0.12 (via minimatch@10 <- shadcn/ts-morph toolchain).
overrides:
  'brace-expansion@1': '1.1.21'
  'brace-expansion@5': '5.0.12'
