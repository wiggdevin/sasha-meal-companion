allowBuilds:
  '@google/genai': true
  protobufjs: true
  esbuild: true
  sharp: false
  unrs-resolver: false

# Dependabot alerts on transitive dev-only deps: each consumer gets the patched
# release on the major it already resolves to.
#   brace-expansion <1.1.21 (via minimatch@3 <- eslint toolchain) and
#   brace-expansion >=4 <5.0.12 (via minimatch@10 <- shadcn/ts-morph toolchain).
#
# 3 HIGH-severity advisories, all transitive, pinned to the first patched
# release on the major each consumer already resolves to (no major bumps):
#   @modelcontextprotocol/sdk >=1.12.0 <1.31.0 (via @google/genai peer dep) — GHSA-6qxp-vccf-f47h
#   sharp <0.35.5 (via next's optional image-optimization dep) — GHSA-wq5f-xc86-pv6w
#   source-map-js >=1.0.0 <1.2.2 (via @tailwindcss/node, css-tree, postcss) — GHSA-68fv-2mgg-jv7q
overrides:
  'brace-expansion@1': '1.1.21'
  'brace-expansion@5': '5.0.12'
  '@modelcontextprotocol/sdk': '>=1.31.0 <2'
  'sharp': '0.35.5'
  'source-map-js': '1.2.2'
